<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danh mục sản phẩm | Có Cái Tiệm</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f6f7f8;color:#28313b}main{max-width:950px;margin:auto;padding:16px}a{color:inherit}.card{background:white;border:1px solid #e0e5e9;border-radius:16px;padding:18px;margin:15px 0}h1{margin:10px 0 5px;font-size:29px}p{color:#73808a;line-height:1.5}input,select,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #d6dde3;max-width:100%}button{background:#293845;color:white;border:0;font-weight:750;cursor:pointer}button:disabled{opacity:.5}.fields{display:grid;grid-template-columns:2fr 1fr auto;align-items:end;gap:9px}.fields label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700}.fields input,.fields select{width:100%}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:90px minmax(0,1fr) 100px;gap:10px;border-bottom:1px solid #edf0f2;padding:11px 0;align-items:center}.sku{font-weight:850;color:#946320}.name{font-weight:700}.note{font-size:12px;color:#7c8791}.tag{font-size:11px;text-align:right}.links{display:flex;gap:14px;flex-wrap:wrap}.hide{display:none}@media(max-width:600px){.fields{grid-template-columns:1fr}.item{grid-template-columns:73px minmax(0,1fr) 75px;gap:5px;font-size:13px}.card{padding:14px}.sku{font-size:12px}}
</style><main><div class="links"><a href="./order-manager.html">← Order Manager</a><a href="./inventory-costs.html">Giá vốn & lô nhập</a><a href="./stock-check.html">Kiểm kho</a></div><h1>Danh mục sản phẩm</h1><p>SKU theo nhóm hàng. Món bán riêng sẽ không xuất hiện trên menu khách hàng.</p><section class="card" id="login"><h2>Quản trị viên</h2><input type="password" id="pass" placeholder="Mã Order Manager"><button id="enter">Đăng nhập</button><p id="loginmsg"></p></section><section id="app" class="hide"><div class="card"><h2>＋ Tạo món bán riêng</h2><p>Chỉ dùng trong quản lý nội bộ và giá vốn. SKU được cấp tự động.</p><div class="fields"><label>Tên món<input id="name" maxlength="160" placeholder="Tên sản phẩm"></label><label>Nhóm hàng<select id="category"><option value="private">Khác / chưa phân nhóm (BR)</option><option value="traicaysay">Trái cây sấy (TC)</option><option value="banhtrang">Bánh tráng (BT)</option><option value="kho">Khô / đồ rim (KH)</option><option value="haisan">Hải sản khô (HS)</option><option value="banh">Bánh các loại (BA)</option><option value="mam">Mắm (MM)</option><option value="sua">Sứa (SU)</option><option value="giavi">Gia vị / kho quẹt (GV)</option><option value="raucusay">Rau củ sấy (RC)</option><option value="traicaychebien">Trái cây chế biến (TF)</option><option value="khac">Ăn vặt khác (AV)</option></select></label><button id="create">Tạo sản phẩm</button></div><p id="msg" role="status"></p></div><div class="card"><h2>Tất cả sản phẩm <span id="total"></span></h2><input id="search" type="search" placeholder="Tìm SKU hoặc tên món..." style="width:100%"><div id="list" class="list"></div></div></section></main><script>
(()=>{'use strict';const URL='https://eswrqkhsvlqndjbrgsqo.supabase.co/rest/v1/rpc/',KEY='sb_publishable_-6iIwPaZQRMkkWAROdfvxg_dmVB81E2',$=id=>document.getElementById(id);let code='',data=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(payload){const r=await fetch(URL+'cct_catalog_admin_v1',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_passcode:code,...payload})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Lỗi kết nối');return d}
function render(){const q=$('search').value.trim().toLocaleLowerCase('vi');$('total').textContent='('+data.length+')';$('list').innerHTML=data.filter(x=>(x.name+' '+x.sku).toLocaleLowerCase('vi').includes(q)).map(x=>'<div class="item"><span class="sku">'+esc(x.sku)+'</span><span><span class="name">'+esc(x.name)+'</span><br><span class="note">'+esc(x.category)+'</span></span><span class="tag">'+(x.cost_only?'Bán riêng':x.is_active?'Trên menu':'Đang ẩn')+'</span></div>').join('')||'<p>Không tìm thấy món.</p>'}
$('enter').onclick=async()=>{code=$('pass').value.trim();if(!code)return;try{data=await rpc({p_action:'list'});$('login').classList.add('hide');$('app').classList.remove('hide');render();sessionStorage.setItem('cct_print_code',code)}catch(e){$('loginmsg').textContent=e.message}};
$('pass').onkeydown=e=>{if(e.key==='Enter')$('enter').click()};
$('create').onclick=async()=>{const name=$('name').value.trim();if(name.length<2)return $('msg').textContent='Nhập tên ít nhất 2 ký tự.';if(!confirm('Tạo món bán riêng '+name+'? Món sẽ không xuất hiện trên menu.'))return;$('create').disabled=true;try{data=await rpc({p_action:'create_private',p_name:name,p_category:$('category').value});$('name').value='';$('msg').textContent='Đã tạo món bán riêng thành công.';render()}catch(e){$('msg').textContent='Không tạo được: '+e.message}finally{$('create').disabled=false}};
$('search').oninput=render;const prior=sessionStorage.getItem('cct_print_code');if(prior){$('pass').value=prior;$('enter').click()}
})();
</script></html>
