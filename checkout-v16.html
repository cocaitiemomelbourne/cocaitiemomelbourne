<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Có Cái Tiệm | Checkout Test v16</title>
</head>
<body>
  <div style="font-family:Arial,sans-serif;padding:24px;text-align:center">Đang tải Có Cái Tiệm…</div>
  <script>
  (async function () {
    try {
      const response = await fetch('./checkout-v15.html?v=16-base', { cache: 'no-cache' });
      if (!response.ok) throw new Error('Không tải được bản nền v15');
      let html = await response.text();

      html = html.replace('checkout-test-v15-featured-qty', 'checkout-test-v16-full-order-lookup');

      const fullLookupScript = `
<script>
document.addEventListener("DOMContentLoaded", function () {
  var btn = document.getElementById("lookupOrderBtn");
  var result = document.getElementById("lookupResult");
  var codeInput = document.getElementById("lookupOrderCode");
  var phoneInput = document.getElementById("lookupPhone");
  if (!btn || !result || !codeInput || !phoneInput) return;

  var SUPABASE_URL = "https://eswrqkhsvlqndjbrgsqo.supabase.co";
  var SUPABASE_KEY = "sb_publishable_-6iIwPaZQRMkkWAROdfvxg_dmVB81E2";

  function isEn(){ return window.CCT_LANG === "en"; }
  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/\"/g,"&quot;")
      .replace(/'/g,"&#39;");
  }
  function money(v){
    if (v === null || v === undefined || v === "") return "";
    var n = Number(v);
    return isNaN(n) ? esc(v) : "$" + n.toFixed(2).replace(/\.00$/,'');
  }
  function statusText(status){
    var vi={new:"Mới",confirmed:"Đã xác nhận",preparing:"Đang chuẩn bị",ready:"Sẵn sàng",completed:"Hoàn tất",cancelled:"Đã huỷ"};
    var en={new:"New",confirmed:"Confirmed",preparing:"Preparing",ready:"Ready",completed:"Completed",cancelled:"Cancelled"};
    return (isEn()?en:vi)[status] || status || (isEn()?"New":"Mới");
  }
  function fulfilmentText(v){
    var vi={pickup:"Pick up Springvale",delivery:"Delivery Melbourne",auspost:"AusPost"};
    var en={pickup:"Pick up Springvale",delivery:"Melbourne delivery",auspost:"AusPost"};
    return (isEn()?en:vi)[v] || v || "";
  }
  function paymentText(v){
    if (!v) return "";
    if (String(v).toLowerCase()==="payid") return "PayID";
    if (String(v).toLowerCase()==="cash") return isEn()?"Cash":"Tiền mặt";
    return v;
  }
  function itemName(item){
    if (item && item.name) return item.name;
    var products = window.CCT_API && window.CCT_API.getProducts ? window.CCT_API.getProducts() : [];
    var p = products.find(function(x){ return Number(x.id) === Number(item && item.id); });
    return p ? p.name : ((isEn()?"Product #":"Món #") + (item && item.id ? item.id : "?"));
  }
  function itemPrice(item){
    if (item && item.unit_price !== undefined && item.unit_price !== null) return item.unit_price;
    var products = window.CCT_API && window.CCT_API.getProducts ? window.CCT_API.getProducts() : [];
    var p = products.find(function(x){ return Number(x.id) === Number(item && item.id); });
    return p ? p.price : null;
  }
  function itemLineTotal(item){
    if (item && item.line_total !== undefined && item.line_total !== null) return item.line_total;
    var price = itemPrice(item);
    return price === null ? null : Number(price) * Number(item.qty || 0);
  }
  function row(label,value){
    if (value === null || value === undefined || value === "") return "";
    return '<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #eee7df"><span style="color:#806f61">'+esc(label)+'</span><strong style="text-align:right">'+esc(value)+'</strong></div>';
  }
  function renderDetails(data){
    var created = data.created_at ? new Date(data.created_at).toLocaleString(isEn()?"en-AU":"vi-VN") : "";
    var items = Array.isArray(data.order_items) ? data.order_items : [];
    var html = '<div style="background:#eef8ef;border:1px solid #cfe5d2;border-radius:16px;padding:16px;color:#2f241b">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px"><div><div style="font-weight:900;font-size:17px">'+esc(data.order_code || "")+'</div><div style="font-size:12px;color:#806f61;margin-top:3px">'+esc(created)+'</div></div><span style="background:#fff;padding:6px 10px;border-radius:999px;font-weight:900;font-size:12px">'+esc(statusText(data.status))+'</span></div>';

    html += row(isEn()?"Customer":"Khách hàng", data.customer_name);
    html += row(isEn()?"Fulfilment":"Nhận hàng", fulfilmentText(data.fulfilment_method));
    if (data.fulfilment_method === "pickup") {
      html += row(isEn()?"Pickup date":"Ngày pick up", data.pickup_date);
      html += row(isEn()?"Pickup time":"Giờ pick up", data.pickup_time);
    } else {
      html += row(isEn()?"Recipient":"Người nhận", data.recipient_name);
      html += row(isEn()?"Address":"Địa chỉ", data.shipping_address);
    }
    html += row(isEn()?"Payment":"Thanh toán", paymentText(data.payment_method));

    if (items.length) {
      html += '<div style="margin-top:14px;font-weight:900">'+(isEn()?"Items":"Món đã đặt")+'</div>';
      html += '<div style="margin-top:7px;background:#fff;border-radius:12px;padding:4px 12px">';
      items.forEach(function(item){
        var name = itemName(item);
        var options = item && (item.option_text || (Array.isArray(item.options) ? item.options.map(function(o){return o.choice || o;}).join(" • ") : ""));
        var qty = Number(item && item.qty || 0);
        var total = itemLineTotal(item);
        html += '<div style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #f0ebe5"><div><strong>'+esc(name)+'</strong>'+(options?'<div style="font-size:12px;color:#806f61;margin-top:3px">'+esc(options)+'</div>':'')+'<div style="font-size:12px;color:#806f61;margin-top:3px">× '+qty+'</div></div><strong style="white-space:nowrap">'+(total===null?'':money(total))+'</strong></div>';
      });
      html += '</div>';
    } else if (data.order_text) {
      html += '<div style="margin-top:14px;font-weight:900">'+(isEn()?"Order details":"Chi tiết đơn")+'</div>';
      html += '<pre style="white-space:pre-wrap;background:#fff;border-radius:12px;padding:12px;font-family:inherit;font-size:12px;line-height:1.5">'+esc(data.order_text)+'</pre>';
    }

    html += '<div style="margin-top:14px">';
    if (data.subtotal !== null && data.subtotal !== undefined) html += row(isEn()?"Subtotal":"Tạm tính", money(data.subtotal));
    if (data.delivery_fee !== null && data.delivery_fee !== undefined) html += row(isEn()?"Delivery fee":"Phí giao hàng", money(data.delivery_fee));
    if (data.total !== null && data.total !== undefined) html += '<div style="display:flex;justify-content:space-between;gap:12px;padding-top:10px;font-size:18px"><strong>'+(isEn()?"Total":"Tổng")+'</strong><strong>'+money(data.total)+'</strong></div>';
    html += '</div>';

    if (data.customer_note) html += '<div style="margin-top:12px;background:#fff8e8;border-radius:10px;padding:10px"><strong>'+(isEn()?"Note: ":"Ghi chú: ")+'</strong>'+esc(data.customer_note)+'</div>';
    html += '</div>';
    result.className = "lookup-result ok";
    result.innerHTML = html;
  }

  btn.addEventListener("click", async function(event){
    event.preventDefault();
    event.stopImmediatePropagation();
    var code = codeInput.value.trim().toUpperCase();
    var phone = phoneInput.value.trim();
    if (!code || !phone) {
      result.className = "lookup-result error";
      result.textContent = isEn()?"Please enter both order code and phone number.":"Vui lòng nhập đầy đủ mã đơn và số điện thoại.";
      return;
    }

    btn.disabled = true;
    btn.textContent = isEn()?"Checking...":"Đang kiểm tra...";
    try {
      var response = await fetch(SUPABASE_URL+"/rest/v1/rpc/lookup_order_details_v1",{
        method:"POST",
        headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},
        body:JSON.stringify({p_order_code:code,p_phone:phone})
      });
      if (!response.ok) throw new Error("lookup");
      var data = await response.json();
      if (!data || !data.found) {
        result.className = "lookup-result error";
        result.textContent = isEn()?"Order not found. Check the code and phone number.":"Không tìm thấy đơn. Vui lòng kiểm tra lại mã đơn và số điện thoại.";
      } else {
        renderDetails(data);
      }
    } catch (error) {
      console.error(error);
      result.className = "lookup-result error";
      result.textContent = isEn()?"Unable to check the order right now.":"Chưa tra cứu được đơn lúc này. Vui lòng thử lại.";
    }
    btn.disabled = false;
    btn.textContent = isEn()?"Check status":"Kiểm tra";
  }, true);
});
<\/script>`;

      html = html.replace(
        "html = html.replace('</body>', featuredQtyScript + '</body>');",
        "html = html.replace('</body>', featuredQtyScript + fullLookupScript + '</body>');"
      );

      html = html.replace(
        "const featuredQtyScript = `",
        "const fullLookupScript = " + JSON.stringify(fullLookupScript) + ";\n\n      const featuredQtyScript = `"
      );

      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      console.error(error);
      document.body.innerHTML = '<div style="font-family:Arial,sans-serif;padding:24px;text-align:center"><strong>Không tải được bản test v16.</strong><br>Vui lòng thử lại sau.</div>';
    }
  })();
  </script>
</body>
</html>
