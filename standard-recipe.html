<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standard Recipe | Có Cái Tiệm</title><style>:root{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f8;color:#29313a}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:20px}.top{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}.top a{border:1px solid #e1e5e9;border-radius:11px;background:#fff;padding:11px;text-decoration:none;color:#536071;font-weight:700;font-size:13px}h1{font-size:clamp(26px,5vw,36px);letter-spacing:-.04em;margin:6px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:#737d88;font-size:13px;line-height:1.5}.card{border:1px solid #e4e8ec;border-radius:16px;background:white;padding:20px;margin:15px 0;box-shadow:0 3px 18px #17203208}input,select,button{width:100%;min-width:0;max-width:100%;min-height:46px;border:1px solid #dfe3e8;border-radius:10px;padding:11px;font:inherit;font-size:16px;background:#fff;color:#29313a}button{background:#293743;color:#fff;font-weight:700;cursor:pointer;border:0}.secondary{background:#eef1f4;color:#536071}.danger{background:#fcebea;color:#9a3030}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:12px;font-weight:750;color:#68717b;margin:12px 0 6px}.item{border:1px solid #e6e9ed;border-radius:12px;padding:13px;margin:9px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.item small{color:#737d88}.item button{width:auto;min-height:38px;font-size:12px;padding:8px 12px}.hide{display:none}.badge{background:#edf1f4;padding:5px 9px;border-radius:9px;font-size:12px;font-weight:700}.actions{display:flex;gap:8px}.note{padding:13px;background:#fff7e8;border:1px solid #f1dfbe;border-radius:10px;font-size:13px;line-height:1.5}@media(max-width:650px){.wrap{padding:15px}.card{padding:16px}.grid{grid-template-columns:minmax(0,1fr)}.item{grid-template-columns:minmax(0,1fr)}.item button{width:100%}.top a{flex:1;text-align:center}}</style></head><body><div class="wrap"><nav class="top"><a href="./inventory-costs.html">← Nhập hàng</a><a href="./production.html">Sơ chế & Mẻ sốt</a><a href="./sales-dashboard.html">Sales Analytics</a></nav><h1>Standard Recipe</h1><p class="muted">Công thức chuẩn cho từng món bán · Tách riêng khỏi nhập hàng và sản xuất.</p><section class="card" id="login"><h2>Quản trị viên</h2><input id="pass" type="password" placeholder="Mã quản trị" autocomplete="off"><button id="enter" style="margin-top:10px">Mở công thức</button><p id="loginMsg" class="muted"></p></section><main id="app" class="hide"><section class="card"><h2>Chọn món trên menu</h2><input id="search" placeholder="Tìm tên món hoặc SKU..."><label>Món bán</label><select id="product"></select><p class="note" id="bom"></p></section><section class="card"><h2>Định lượng mỗi phần</h2><div id="items"></div><hr style="border:0;border-top:1px solid #e7e9ed;margin:20px 0"><h2 id="formTitle">Thêm nguyên liệu</h2><form id="form"><div class="grid"><div><label>Nhóm</label><select id="group"><option value="jellyfish">Sứa</option><option value="sauce">Sốt</option><option value="vegetable">Rau</option><option value="packaging">Bao bì</option><option value="ingredient">Khác</option></select></div><div><label>Tên nguyên liệu / thành phần</label><select id="ingredient" required></select></div><div><label>Số lượng dùng cho 1 món</label><input id="qty" type="number" min=".001" step="any" required></div><div><label>Đơn vị</label><select id="unit"><option value="g">g</option><option value="ml">ml</option><option value="piece">cái</option><option value="bag">túi</option></select></div></div><label>Ghi chú (tùy chọn)</label><input id="note" placeholder="VD: chọn 1 trong 5 loại sứa"><div class="actions" style="margin-top:14px"><button type="submit" id="save">Lưu nguyên liệu</button><button type="button" class="secondary hide" id="cancel">Hủy sửa</button></div><p id="msg" class="muted"></p></form></section><section class="card"><h2>Tạo SKU nguyên liệu</h2><p class="muted">Tạo mã một lần để dùng lại trong các công thức.</p><div class="grid"><div><label>SKU</label><input id="newSku" placeholder="NL-SUA-006"></div><div><label>Tên nguyên liệu</label><input id="newName" placeholder="Tên nguyên liệu"></div><div><label>Đơn vị</label><select id="newUnit"><option value="g">g</option><option value="ml">ml</option><option value="piece">cái</option><option value="bag">túi</option></select></div></div><button type="button" id="createIngredient">Tạo SKU</button><p class="muted" id="ingredientMsg"></p></section></main></div><script>(()=>{'use strict';const base='https://eswrqkhsvlqndjbrgsqo.supabase.co',key='sb_publishable_-6iIwPaZQRMkkWAROdfvxg_dmVB81E2',el=id=>document.getElementById(id);let pass='',products=[],items=[],bom=[],ingredients=[],editing=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&quot;','\'':'&#39;'}[c]));async function rpc(action,payload={}){const r=await fetch(base+'/rest/v1/rpc/cct_standard_recipe_admin_v1',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({p_passcode:pass,p_action:action,p_payload:payload})});const x=await r.json();if(!r.ok)throw Error(x.message||'Lỗi lưu dữ liệu');return x}function ingredientOptions(){el('ingredient').innerHTML='<option value="">Chọn SKU nguyên liệu</option>'+ingredients.map(i=>'<option value="'+i.id+'">['+esc(i.sku)+'] '+esc(i.name)+' ('+esc(i.unit)+')</option>').join('')}function options(){const search=el('search').value.toLowerCase(),previous=el('product').value;const list=products.filter(p=>(p.name+' '+(p.sku||'')).toLowerCase().includes(search));el('product').innerHTML=list.map(p=>'<option value="'+p.id+'">['+esc(p.sku||'')+'] '+esc(p.name)+'</option>').join('');if(list.some(p=>String(p.id)===previous))el('product').value=previous;render()}function render(){const id=Number(el('product').value),p=products.find(x=>x.id===id),b=bom.find(x=>x.sales_sku===p?.sku);el('bom').textContent=b?(p.sku==='SU-002'?'Combo: 350g sứa (5–6 loại), 2 loại sốt × 100ml = 200ml, 1 túi rau gồm 3 món.':'Single: 250g sứa (1 loại), 1 loại sốt 100ml.'):'Nhập định lượng chuẩn cho từng nguyên liệu. Công thức này chưa tự động trừ tồn hoặc ghi COGS.';const rows=items.filter(x=>x.product_id===id);el('items').innerHTML=rows.map(x=>'<div class="item"><div><strong>'+esc(x.ingredient_name)+'</strong> <span class="badge">'+esc(x.ingredient_name==='Sứa khách chọn'?'Khách tự chọn':({jellyfish:'Sứa',sauce:'Sốt',vegetable:'Rau / gia vị',packaging:'Bao bì',ingredient:'Nguyên liệu'}[x.component_group]||x.component_group))+'</span><div><small>'+Number(x.quantity)+' '+esc(x.unit)+(x.notes?' · '+esc(x.notes):'')+'</small></div></div><div class="actions"><button type="button" class="secondary" data-edit="'+x.id+'">Sửa</button><button type="button" class="danger" data-delete="'+x.id+'">Xóa</button></div></div>').join('')||'<p class="muted">Chưa nhập nguyên liệu cho món này.</p>';el('items').querySelectorAll('[data-edit]').forEach(btn=>btn.onclick=()=>{const x=items.find(y=>y.id===Number(btn.dataset.edit));editing=x.id;el('group').value=x.component_group;el('ingredient').value=String(x.ingredient_id||'');el('qty').value=x.quantity;el('unit').value=x.unit;el('note').value=x.notes||'';el('formTitle').textContent='Sửa nguyên liệu';el('cancel').classList.remove('hide');el('form').scrollIntoView({behavior:'smooth',block:'center'})});el('items').querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=async()=>{if(!confirm('Xóa nguyên liệu này khỏi công thức?'))return;try{await rpc('delete',{id:Number(btn.dataset.delete)});await load()}catch(e){alert(e.message)}})}async function load(){const data=await rpc('list');products=data.products;items=data.items;bom=data.jellyfish_bom;ingredients=data.ingredients||[];ingredientOptions();options()}function reset(){editing=null;el('form').reset();el('formTitle').textContent='Thêm nguyên liệu';el('cancel').classList.add('hide')}el('createIngredient').onclick=async()=>{try{await rpc('ingredient',{sku:el('newSku').value.trim(),name:el('newName').value.trim(),unit:el('newUnit').value});await load();el('ingredientMsg').textContent='Đã tạo SKU nguyên liệu';el('newSku').value='';el('newName').value=''}catch(e){el('ingredientMsg').textContent=e.message}};el('enter').onclick=async()=>{pass=el('pass').value;try{await load();el('login').classList.add('hide');el('app').classList.remove('hide')}catch(e){el('loginMsg').textContent=e.message}};el('search').oninput=options;el('product').onchange=()=>{reset();render()};el('cancel').onclick=reset;el('form').onsubmit=async e=>{e.preventDefault();const button=el('save');button.disabled=true;try{await rpc('save',{id:editing,product_id:Number(el('product').value),ingredient_id:Number(el('ingredient').value),quantity:Number(el('qty').value),unit:el('unit').value,component_group:el('group').value,notes:el('note').value});reset();await load();el('msg').textContent='Đã lưu công thức.'}catch(err){el('msg').textContent=err.message}finally{button.disabled=false}}})();</script></body></html>
