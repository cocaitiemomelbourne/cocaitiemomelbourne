<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Kiểm kho - Có Cái Tiệm</title><style>
*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#fff8ec;color:#332519}main{max-width:900px;margin:auto;padding:16px}h1{margin:12px 0 3px}p,small{color:#786653}section{background:white;border:1px solid #eadcca;border-radius:16px;padding:16px;margin:13px 0}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #ddd0be}button{background:#38291c;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}input[type=number]{width:95px;text-align:center;font-size:18px;font-weight:bold}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.toolbar input{flex:1;min-width:160px}.row{display:grid;grid-template-columns:1fr 100px 105px;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #f0e5d9}.row:last-child{border:0}.row b{display:block}.row small{font-size:12px}.center{text-align:center}.changed{color:#ae6111;font-weight:bold}.summary{display:flex;justify-content:space-between;gap:8px}.footer{position:sticky;bottom:0;background:#fff8ec;padding:12px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}.hide{display:none}#message{white-space:pre-wrap;font-size:12px}@media(max-width:500px){.row{grid-template-columns:1fr 65px 83px;gap:5px}.row b{font-size:13px}.row input{width:80px;padding:9px 2px}section{padding:12px}} </style>
<main><a href="./order-manager.html">← Order Manager</a><h1>📦 Kiểm kho</h1><p>Có Cái Tiệm · Melbourne — nhập số hàng thực tế</p>
<section id="login"><h3>Mã quản trị</h3><p>Dùng mã giống Order Manager</p><input id="password" type="password" placeholder="Mã quản trị"><button id="open">Mở kiểm kho</button><p id="authMsg"></p></section>
<div id="app" class="hide"><section><div class="summary"><span>Tổng món: <b id="total">0</b></span><span>Đã kiểm: <b id="count">0</b></span><span>Chênh lệch: <b id="diff">0</b></span></div><p>Để trống nếu chưa kiểm. Nhập 0 nếu thực tế đã hết.</p><div class="toolbar"><input id="search" placeholder="Tìm món..."><select id="filter"><option value="all">Tất cả</option><option value="active">Đang bán</option><option value="inactive">Đang ẩn</option><option value="diff">Chênh lệch</option><option value="unchecked">Chưa kiểm</option></select><button id="refresh">Tải lại</button></div></section>
<section><div class="row"><b>Sản phẩm</b><small class="center">Tồn cũ</small><small class="center">Thực tế</small></div><div id="rows"></div></section><section><h3>Lịch sử điều chỉnh</h3><div id="history"></div></section><div class="footer"><div id="message">Chưa có điều chỉnh</div><button id="save" disabled>Lưu (0)</button></div></div></main>
<script>
(()=>{const U='https://eswrqkhsvlqndjbrgsqo.supabase.co/rest/v1/rpc/',K='sb_publishable_-6iIwPaZQRMkkWAROdfvxg_dmVB81E2',$=s=>document.getElementById(s);let pass='',items=[],counts=new Map(),busy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(fn,args){let r=await fetch(U+fn,{method:'POST',headers:{'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(args)}),v=await r.json().catch(()=>({}));if(!r.ok)throw Error(v.message||'Lỗi kết nối');return v}
const entered=p=>counts.has(String(p.id))&&counts.get(String(p.id))!=='',different=p=>entered(p)&&Number(counts.get(String(p.id)))!==Number(p.stock_qty);
function stats(){let n=items.filter(entered).length,d=items.filter(different).length;$('total').textContent=items.length;$('count').textContent=n;$('diff').textContent=d;$('save').textContent='Lưu ('+d+')';$('save').disabled=!d||busy}
function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;let show=items.filter(p=>p.name.toLowerCase().includes(q)&&(f==='all'||f==='active'&&p.is_active||f==='inactive'&&!p.is_active||f==='diff'&&different(p)||f==='unchecked'&&!entered(p)));$('rows').innerHTML=show.map(p=>'<div class="row"><div><b>'+esc(p.name)+'</b><small>'+esc(p.category)+(p.is_active?'':' · Đang ẩn')+(different(p)?' · <span class="changed">Có chênh lệch</span>':'')+'</small></div><b class="center">'+esc(p.stock_qty===null?'∞':p.stock_qty)+'</b><input type="number" min="0" max="1000000" step="1" inputmode="numeric" data-id="'+p.id+'" value="'+esc(counts.get(String(p.id))??'')+'" placeholder="—"></div>').join('')||'<p>Không có món phù hợp.</p>';stats()}
async function history(){let arr=await rpc('cct_stock_count_history_v1',{p_passcode:pass,p_limit:30});$('history').innerHTML=arr.map(x=>'<div class="row" style="grid-template-columns:1fr auto"><span><b>'+esc(x.product_name)+'</b><small>'+new Date(x.changed_at).toLocaleString('vi-VN',{timeZone:'Australia/Melbourne'})+'</small></span><b>'+esc(x.old_qty===null?'∞':x.old_qty)+' → '+esc(x.new_qty)+'</b></div>').join('')||'<p>Chưa có lịch sử.</p>'}
async function load(){items=await rpc('cct_stock_count_list_v1',{p_passcode:pass});counts.clear();render();await history()}
$('open').onclick=async()=>{pass=$('password').value.trim();if(!pass)return;$('open').disabled=true;try{await load();$('login').classList.add('hide');$('app').classList.remove('hide');sessionStorage.setItem('cct_print_code',pass)}catch(e){$('authMsg').textContent=e.message==='not_authorized'?'Mã quản trị không đúng.':e.message}finally{$('open').disabled=false}};
$('password').onkeydown=e=>{if(e.key==='Enter')$('open').click()};
$('rows').oninput=e=>{if(!e.target.matches('[data-id]'))return;let s=e.target.value;if(s!==''&&(!/^\d+$/.test(s)||Number(s)>1000000))return;e.target.setCustomValidity('');counts.set(e.target.dataset.id,s);let p=items.find(p=>String(p.id)===e.target.dataset.id);e.target.closest('.row').querySelector('small').innerHTML=esc(p.category)+(p.is_active?'':' · Đang ẩn')+(different(p)?' · <span class="changed">Có chênh lệch</span>':'');stats()};
$('filter').onchange=render;$('search').oninput=render;$('refresh').onclick=async()=>{if(counts.size&&!confirm('Bỏ số đếm chưa lưu?'))return;try{await load()}catch(e){alert(e.message)}};
$('save').onclick=async()=>{let arr=items.filter(different);if(!arr.length||!confirm('Lưu tồn kho mới cho '+arr.length+' món?'))return;busy=true;stats();let saved=0,errors=[];for(let p of arr){try{let n=Number(counts.get(String(p.id)));if(!Number.isSafeInteger(n)||n<0||n>1000000)throw Error('Số không hợp lệ');await rpc('cct_stock_count_save_v1',{p_passcode:pass,p_product_id:p.id,p_expected_qty:p.stock_qty,p_new_qty:n});p.stock_qty=n;counts.delete(String(p.id));saved++}catch(e){errors.push(p.name+': '+(e.message==='stock_changed_reload'?'Tồn đã thay đổi, vui lòng tải lại':e.message))}}busy=false;render();$('message').textContent='Đã lưu '+saved+' món.'+(errors.length?'\n'+errors.join('\n'):'');await history().catch(()=>{})};
let previous=sessionStorage.getItem('cct_print_code');if(previous){$('password').value=previous;$('open').click()}
window.onbeforeunload=e=>{if(items.some(different)){e.preventDefault();e.returnValue=''}}
})();
</script></html>
