ansform:translateX(100%);transition:.25s;display:flex;flex-direction:column}.panel.show{transform:translateX(0)}.phead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.plist{padding:10px 18px;overflow:auto;flex:1}.prow{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.checkout{padding:16px 18px;border-top:1px solid var(--line);overflow:auto;max-height:65vh}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:800}label{font-size:12px;font-weight:700;display:block;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d8cec4;border-radius:9px;font:inherit}.pay{display:flex;gap:8px}.pay label{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px}.order{white-space:pre-wrap;background:#f7f4f1;padding:12px;border-radius:10px;margin-top:10px;display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:10px}.heroBox{padding:26px}}
</style></head><body><div class="top">Hàng có sẵn • Pick up Springvale • Delivery Melbourne • AusPost</div><header><div class="nav"><div class="brand">🍋 Có Cái Tiệm</div><button class="dark" onclick="openCart()">🛒 Giỏ hàng <span id="count">0</span></button></div></header><div class="hero"><div class="heroBox"><h1>Ăn là ghiền.</h1><p>Tiệm ăn vặt Melbourne. Chọn món, thêm vào giỏ hàng và gửi đơn cho Tiệm qua Messenger.</p></div></div><section><h2>Menu</h2><div class="filters"><button class="filter active" onclick="filterP('all',this)">Tất cả</button><button class="filter" onclick="filterP('sua',this)">Sứa</button><button class="filter" onclick="filterP('banhtrang',this)">Bánh tráng</button><button class="filter" onclick="filterP('kho',this)">Khô</button><button class="filter" onclick="filterP('khac',this)">Ăn vặt khác</button></div><div id="grid" class="grid"></div></section><footer><div class="foot"><strong>Có Cái Tiệm — Ăn Vặt Melbourne</strong><br>Facebook & TikTok: @cocaitiem.o.melbourne</div></footer><div id="ov" class="overlay" onclick="closeCart()"></div><aside id="cart" class="panel"><div class="phead"><strong>Giỏ hàng</strong><button onclick="closeCart()">✕</button></div><div id="cartList" class="plist"></div><div class="checkout"><div class="total"><span>Tổng</span><span>$<span id="total">0</span></span></div><label>Tên khách</label><input id="name" placeholder="Tên của bạn"><label>Số điện thoại</label><input id="phone" placeholder="04xx xxx xxx"><label>Nhận hàng</label><select id="delivery"><option>Pick up Springvale</option><option>Delivery Melbourne</option><option>AusPost</option></select><label>Thanh toán</label><div class="pay"><label><input type="radio" name="payment" value="Cash" checked> 💵 Cash</label><label><input type="radio" name="payment" value="PayID"> 📱 PayID</label></div><label>Ghi chú</label><textarea id="note" rows="2"></textarea><button class="dark" style="width:100%;margin-top:12px" onclick="makeOrder()">Tạo đơn hàng</button><div id="orde const P=[{name:"Ly Sứa Single",price:20,category:"sua",emoji:"🪼",description:"Chọn 1 loại sứa + 1 loại sốt Thái hoặc Mắm Nhĩ."},{name:"Ly Sứa Combo",price:32,category:"sua",emoji:"🥗",description:"Mix 5 loại sứa random, kèm Sốt Thái & Mắm Nhĩ."},{name:"Bánh Tráng Xì Ke 100g",price:6,category:"banhtrang",emoji:"🌶️",description:"Đậm vị, cay nhẹ, ăn vui miệng."},{name:"Bánh Tráng Sate Tôm Hành 150g",price:10,category:"banhtrang",emoji:"🦐",description:"Sate thơm, tôm hành đậm đà."},{name:"Bánh Tráng Bò Tỏi Chua Cay Duy Best 250g",price:12,category:"banhtrang",emoji:"🥩",description:"Best seller — chua cay, thơm bò tỏi."},{name:"Khô Gà Lá Chanh",price:8,category:"kho",emoji:"🍗",description:"Thơm lá chanh, dai nhẹ, dễ ăn."},{name:"Khô Heo Cháy Tỏi",price:10,category:"kho",emoji:"🥓",description:"Mặn ngọt vừa miệng, thơm tỏi."},{name:"Mực Xé Nước Dừa",price:10,category:"kho",emoji:"🦑",description:"Dai ngọt, thơm vị nước dừa."},{name:"Cơm Cháy Chà Bông 500g",price:18,category:"khac",emoji:"🍘",description:"Giòn rụm, nhiều chà bông."},{name:"Ghẹ Sữa Rim Giòn 130g",price:15,category:"khac",emoji:"🦀",description:"Giòn, đậm vị."},{name:"Bánh Gấu Mix 3 Vị 350g",price:15,category:"khac",emoji:"🐻",description:"Mix 3 vị, giòn thơm."}];let cart=[];const PAYID="ĐIỀN PAYID CỦA TIỆM",MESSENGER="cocaitiem.o.melbourne",esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),money=v=>Number(v||0).toFixed(2).replace(".00","");
function render(cat="all"){let a=cat==="all"?P:P.filter(p=>p.category===cat);grid.innerHTML=a.map(p=>{let i=P.indexOf(p);return '<div class="product"><div class="visual">'+p.emoji+'</div><div class="body"><h3>'+esc(p.name)+'</h3><div class="desc">'+esc(p.description)+'</div><div class="bottom"><span class="price">$'+money(p.price)+'</span><button class="add" onclick="addCart('+i+')">+</button></div></div></div>'}).join("")}function filterP(c,b){document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(c)}function addCart(i){let p=P[i],f=cart.find(x=>x.name===p.name);f?f.qty++:cart.push({name:p.name,price:p.price,qty:1});updateCart()}function updateCart(){count.textContent=cart.reduce((s,x)=>s+x.qty,0);cartList.innerHTML=cart.length?cart.map((x,i)=>'<div class="prow"><div><b>'+esc(x.name)+'</b><br><small>$'+money(x.price)+' × '+x.qty+'</small></div><div><button onclick="qty('+i+',-1)">−</button> <button onclick="qty('+i+',1)">＋</button></div></div>').join(""):"Giỏ hàng đang trống.";total.textContent=money(cart.reduce((s,x)=>s+x.price*x.qty,0))}function qty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateCart()}function openCart(){ov.classList.add("show");cart.classList.add("show");updateCart()}function closeCart(){ov.classList.remove("show");cart.classList.remove("show")}function makeOrder(){if(!cart.length)return alert("Vui lòng thêm sản phẩm.");let pay=document.querySelector('input[name="payment"]:checked').value,t=cart.reduce((s,x)=>s+x.price*x.qty,0),lines=cart.map(x=>"• "+x.qty+" x "+x.name+" — $"+money(x.price*x.qty)).join("\n"),txt="ĐƠN HÀNG — CÓ CÁI TIỆM\n\nKhách: "+(name.value||"Chưa nhập")+"\nSĐT: "+(phone.value||"Chưa nhập")+"\n\n"+lines+"\n\nTổng sản phẩm: $"+money(t)+"\nNhận hàng: "+delivery.value+"\nThanh toán: "+pay+"\nGhi chú: "+(note.value||"Không có");if(pay==="PayID")txt+="\n\nPayID: "+PAYID;order.style.display="block";order.textContent=txt;copy.style.display=msg.style.display="block"}async function copyOrder(){await navigator.clipboard.writeText(order.textContent);alert("Đã copy đơn hàng.")}async function sendMessenger(){try{await navigator.clipboard.writeText(order.textContent)}catch(e){}window.open("https://m.me/"+MESSENGER,"_blank")}render();updateCart();
</script></body></html>
